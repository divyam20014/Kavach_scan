[project]
name = "vapt-workbench"
version = "0.0.1"
description = "Local-first VAPT Workbench backend (filesystem persistence, no database)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[tool.poetry]
package-mode = true
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
httpx = ">=0.27,<1"   # required by fastapi.testclient
ruff = ">=0.6"
mypy = ">=1.11"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["app"]
